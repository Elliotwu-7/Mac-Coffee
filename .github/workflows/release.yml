name: Verified Direct Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Sign, notarize, and publish DMG
    runs-on: macos-15
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      MACCOFFEE_DEVELOPER_ID: ${{ secrets.MACCOFFEE_DEVELOPER_ID }}
      MACCOFFEE_APPCAST_URL: ${{ secrets.MACCOFFEE_APPCAST_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require release credentials
        env:
          CERTIFICATE_P12: ${{ secrets.MACCOFFEE_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACCOFFEE_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.MACCOFFEE_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACCOFFEE_NOTARY_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.MACCOFFEE_NOTARY_TEAM_ID }}
          SPARKLE_KEY: ${{ secrets.MACCOFFEE_SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$MACCOFFEE_DEVELOPER_ID"
          test -n "$MACCOFFEE_APPCAST_URL"
          test -n "$CERTIFICATE_P12"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$NOTARY_APPLE_ID"
          test -n "$NOTARY_PASSWORD"
          test -n "$NOTARY_TEAM_ID"
          test -n "$SPARKLE_KEY"

      - name: Install build tools
        run: brew bundle

      - name: Generate and verify canonical Xcode project
        run: |
          xcodegen generate
          git diff --exit-code -- MacCoffee.xcodeproj

      - name: Verify source release assets
        run: ./scripts/verify-release-assets.sh

      - name: Verify release tag matches product version
        run: |
          version=$(/usr/bin/awk -F ' = ' '/^MARKETING_VERSION = / { print $2 }' Config/Shared.xcconfig)
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Unit tests
        run: >-
          xcodebuild test
          -project MacCoffee.xcodeproj
          -scheme MacCoffeeTests
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO

      - name: MCP integration tests
        run: >-
          xcodebuild test
          -project MacCoffee.xcodeproj
          -scheme MacCoffeeIntegrationTests
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO

      - name: Verify Direct and App Store boundaries
        run: |
          ./scripts/build-local.sh direct
          ./scripts/build-local.sh app-store
          ./scripts/verify-bundles.sh

      - name: Materialize signing and notarization credentials
        env:
          CERTIFICATE_P12: ${{ secrets.MACCOFFEE_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACCOFFEE_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.MACCOFFEE_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACCOFFEE_NOTARY_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.MACCOFFEE_NOTARY_TEAM_ID }}
          SPARKLE_KEY: ${{ secrets.MACCOFFEE_SPARKLE_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$SPARKLE_KEY" > "$RUNNER_TEMP/maccoffee-sparkle-key"
          printf '%s' "$CERTIFICATE_P12" | /usr/bin/base64 --decode > "$RUNNER_TEMP/maccoffee-developer-id.p12"

          keychain="$RUNNER_TEMP/maccoffee-signing.keychain-db"
          keychain_password="$(/usr/bin/uuidgen)"
          printf 'MACCOFFEE_NOTARY_PROFILE=maccoffee-ci\n' >> "$GITHUB_ENV"
          printf 'MACCOFFEE_NOTARY_KEYCHAIN=%s\n' "$keychain" >> "$GITHUB_ENV"
          /usr/bin/security create-keychain -p "$keychain_password" "$keychain"
          /usr/bin/security set-keychain-settings -lut 21600 "$keychain"
          /usr/bin/security unlock-keychain -p "$keychain_password" "$keychain"
          /usr/bin/security import "$RUNNER_TEMP/maccoffee-developer-id.p12" \
            -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          /usr/bin/security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          /usr/bin/security list-keychains -d user -s "$keychain"
          /usr/bin/security default-keychain -d user -s "$keychain"
          /usr/bin/security find-identity -v -p codesigning "$keychain" | /usr/bin/grep -F "$MACCOFFEE_DEVELOPER_ID"

          xcrun notarytool store-credentials maccoffee-ci \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            --keychain "$keychain"

      - name: Build verified release
        env:
          MACCOFFEE_SPARKLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/maccoffee-sparkle-key
        run: ./scripts/release-direct.sh

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/MacCoffee-*.dmg
            dist/release/MacCoffee-*.dmg.sha256
            dist/release/appcast.xml
          generate_release_notes: true

      - name: Remove temporary credentials
        if: always()
        run: |
          if test -n "${MACCOFFEE_NOTARY_KEYCHAIN:-}"; then
            /usr/bin/security delete-keychain "$MACCOFFEE_NOTARY_KEYCHAIN" || true
          fi
          /bin/rm -f "$RUNNER_TEMP/maccoffee-developer-id.p12" "$RUNNER_TEMP/maccoffee-sparkle-key"
