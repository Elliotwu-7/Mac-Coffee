name: MacCoffee

options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "13.0"
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

packages:
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    exactVersion: 0.12.1
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "6.0"
    ARCHS: "$(ARCHS_STANDARD)"
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_STYLE: Automatic

targets:
  MacCoffeeCore:
    type: framework
    platform: macOS
    sources:
      - Sources/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rekurt.maccoffee.core
        PRODUCT_NAME: MacCoffeeCore
        GENERATE_INFOPLIST_FILE: YES

  MacCoffeeAppStoreCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/Core
        excludes:
          - MCP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rekurt.maccoffee.app-store-core
        PRODUCT_NAME: MacCoffeeAppStoreCore
        GENERATE_INFOPLIST_FILE: YES

  MacCoffeeDirect:
    type: application
    platform: macOS
    sources:
      - Sources/Direct
      - Sources/MCPBrokerShared
      - path: Resources/Shared
        buildPhase: resources
      - path: Resources/Direct
        excludes:
          - Info.plist
        buildPhase: resources
    dependencies:
      - target: MacCoffeeCore
      - target: MacCoffeeMCPBroker
        embed: true
      - target: MacCoffeeMCP
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - package: Sparkle
    configFiles:
      Debug: Config/Direct.xcconfig
      Release: Config/Direct.xcconfig

  MacCoffeeAppStore:
    type: application
    platform: macOS
    sources:
      - Sources/AppStore
      - path: Resources/Shared
        buildPhase: resources
      - path: Resources/AppStore
        excludes:
          - Info.plist
        buildPhase: resources
    dependencies:
      - target: MacCoffeeAppStoreCore
    configFiles:
      Debug: Config/AppStore.xcconfig
      Release: Config/AppStore.xcconfig

  MacCoffeeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/Unit
      - Tests/Support
      - Sources/Direct/MCP
      - Sources/Direct/Security/KeychainMCPCredentialStore.swift
      - Sources/Direct/Security/SecurityClientIdentityVerifier.swift
      - Sources/MCPHelper/Security/KeychainClientKeyStore.swift
      - Sources/MCPHelper/Security/ParentProcessIdentity.swift
      - Sources/MCPBrokerShared
    dependencies:
      - target: MacCoffeeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rekurt.maccoffee.tests
        GENERATE_INFOPLIST_FILE: YES

  MacCoffeeUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/UI
    dependencies:
      - target: MacCoffeeDirect
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rekurt.maccoffee.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MacCoffeeDirect

  MacCoffeeIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/Integration
      - Tests/Support
      - path: Sources/Direct/MCP
        excludes:
          - DirectMCPEnvironment.swift
          - MCPActivityView.swift
          - MCPPairingView.swift
          - MCPSettingsView.swift
          - MCPSettingsViewModel.swift
          - Setup
      - Sources/MCPHelper/XPC
      - Sources/MCPHelper/MCPHelperRuntime.swift
      - Sources/MCPHelper/Security
      - Sources/Direct/Security/SecurityClientIdentityVerifier.swift
      - Sources/MCPBrokerShared
      - path: Sources/MCPBroker
        excludes:
          - main.swift
    dependencies:
      - target: MacCoffeeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rekurt.maccoffee.integration-tests
        GENERATE_INFOPLIST_FILE: YES

  MacCoffeeMCPBroker:
    type: xpc-service
    platform: macOS
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    sources:
      - Sources/MCPBroker
      - Sources/MCPBrokerShared
    info:
      path: Resources/MCPBroker/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rekurt.maccoffee.direct.mcp-broker
        PRODUCT_BUNDLE_IDENTIFIER[config=Debug]: com.rekurt.maccoffee.direct.debug.mcp-broker
        PRODUCT_NAME: MacCoffeeMCPBroker
        SKIP_INSTALL: YES

  MacCoffeeMCP:
    type: tool
    platform: macOS
    sources:
      - Sources/MCPHelper/main.swift
      - Sources/MCPHelper/MCPServerAdapter.swift
      - Sources/MCPHelper/MCPToolAdapter.swift
      - Sources/MCPHelper/MCPResourceAdapter.swift
      - Sources/MCPHelper/MCPHelperRuntime.swift
      - Sources/MCPHelper/Diagnostics.swift
      - Sources/MCPHelper/Security
      - Sources/MCPHelper/XPC
      - Sources/MCPBrokerShared
      - Sources/Direct/Security/SecurityClientIdentityVerifier.swift
    dependencies:
      - target: MacCoffeeCore
      - package: MCP
        product: MCP
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rekurt.maccoffee.mcp-helper
        PRODUCT_NAME: MacCoffeeMCP
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path @executable_path/../Frameworks"
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"

  MacCoffeeScreenshots:
    type: application
    platform: macOS
    sources:
      - Tools/Screenshots
      - path: Resources/Shared
        buildPhase: resources
    dependencies:
      - target: MacCoffeeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rekurt.maccoffee.screenshots
        PRODUCT_NAME: MacCoffeeScreenshots
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO

schemes:
  MacCoffeeDirect:
    build:
      targets:
        MacCoffeeDirect: all
    run:
      config: Debug
    archive:
      config: Release

  MacCoffeeAppStore:
    build:
      targets:
        MacCoffeeAppStore: all
    run:
      config: Debug
    archive:
      config: Release

  MacCoffeeTests:
    build:
      targets:
        MacCoffeeCore: all
        MacCoffeeDirect: all
        MacCoffeeAppStore: all
        MacCoffeeTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MacCoffeeTests

  MacCoffeeUITests:
    build:
      targets:
        MacCoffeeDirect: all
        MacCoffeeAppStore: all
        MacCoffeeUITests: [test]
    test:
      config: Debug
      macroExpansion: MacCoffeeDirect
      targets:
        - MacCoffeeUITests

  MacCoffeeIntegrationTests:
    build:
      targets:
        MacCoffeeCore: all
        MacCoffeeMCP: all
        MacCoffeeIntegrationTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MacCoffeeIntegrationTests

  MacCoffeeScreenshots:
    build:
      targets:
        MacCoffeeScreenshots: all
    run:
      config: Release

  MacCoffeeMCP:
    build:
      targets:
        MacCoffeeMCP: all
